<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AEGIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="brand-logo">🛡️</div>
            <h1><span>AEGIS</span></h1>
            <p>Sistem Manajemen Peringatan Cuaca & Koordinasi Tim Siaga Bencana.</p>
            <div class="brand-features">
                <div class="brand-feature">
                    <div class="feature-icon">📡</div>
                    <span>Integrasi langsung BMKG API</span>
                </div>
                <div class="brand-feature">
                    <div class="feature-icon">🔔</div>
                    <span>Notifikasi otomatis 3 hari berturut</span>
                </div>
                <div class="brand-feature">
                    <div class="feature-icon">📋</div>
                    <span>Checklist SOP Tim Siaga</span>
                </div>
            </div>
        </div>

        <div class="login-form-section">
            <h2>Masuk</h2>
            <p class="subtitle">Silakan masuk untuk mengakses dashboard.</p>
            <form action="/login" method="post">
                <div class="field">
                    <label for="username">Employee ID</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan Employee ID" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn-login">LOGIN</button>
            </form>
        </div>
    </div>
</body>
</html>
