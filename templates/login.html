<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AEGIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0606;
            --card: #1a0d0d;
            --border: rgba(255,80,80,0.08);
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --accent-glow: rgba(192,57,43,0.2);
            --accent-gradient: linear-gradient(135deg, #8b0000, #c0392b, #e74c3c);
            --text: #f5e6e6;
            --text-dim: #b8a0a0;
            --text-muted: #7a6060;
            --red: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(circle at 30% 50%, rgba(139,0,0,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 70% 80%, rgba(192,57,43,0.1) 0%, transparent 40%);
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: slideUp 0.6s ease-out;
        }

        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, #1a0808 0%, #2d0f0f 50%, #1a0808 100%);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(192,57,43,0.12) 0%, transparent 50%);
        }

        .brand-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            position: relative;
            filter: drop-shadow(0 0 20px rgba(192,57,43,0.4));
        }

        .login-brand h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            position: relative;
            letter-spacing: 4px;
        }

        .login-brand h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-brand p {
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.6;
            position: relative;
            text-align: center;
            max-width: 280px;
        }

        .brand-features {
            margin-top: 2rem;
            position: relative;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 1px solid rgba(192,57,43,0.2);
        }

        .login-form-section {
            flex: 1;
            background: var(--card);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-form-section .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .field { margin-bottom: 1.25rem; }
        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .field input::placeholder { color: var(--text-muted); }

        .error-msg {
            color: var(--red);
            font-size: 0.8rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0.75rem;
            background: rgba(231,76,60,0.1);
            border: 1px solid rgba(231,76,60,0.2);
            border-radius: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 0.5rem;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(192,57,43,0.35);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .login-brand { display: none; }
            .login-wrapper { max-width: 420px; border-radius: 12px; }
            .login-form-section { padding: 2rem 1.5rem; }
        }

        @media (max-width: 400px) {
            body { padding: 0; }
            .login-wrapper {
                max-width: 100%; min-height: 100vh;
                border-radius: 0; border: none;
                box-shadow: none;
            }
            .login-form-section { padding: 2rem 1.25rem; }
            .field input { padding: 0.85rem 1rem; font-size: 1rem; }
            .btn-login { padding: 1rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="brand-logo">🛡️</div>
            <h1><span>AEGIS</span></h1>
            <p>Sistem Manajemen Peringatan Cuaca & Koordinasi Tim Siaga Bencana.</p>
            <div class="brand-features">
                <div class="brand-feature">
                    <div class="feature-icon">📡</div>
                    <span>Integrasi langsung BMKG API</span>
                </div>
                <div class="brand-feature">
                    <div class="feature-icon">🔔</div>
                    <span>Notifikasi otomatis 3 hari berturut</span>
                </div>
                <div class="brand-feature">
                    <div class="feature-icon">📋</div>
                    <span>Checklist SOP Tim Siaga</span>
                </div>
            </div>
        </div>

        <div class="login-form-section">
            <h2>Masuk</h2>
            <p class="subtitle">Silakan masuk untuk mengakses dashboard.</p>
            <form action="/login" method="post">
                <div class="field">
                    <label for="username">Employee ID</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan Employee ID" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn-login">LOGIN</button>
            </form>
        </div>
    </div>
</body>
</html>
