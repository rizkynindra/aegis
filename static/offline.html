<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #682727;
            color: #ffffff;
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        main {
            text-align: center;
            padding: 1.5rem;
            max-width: 22rem;
        }

        img {
            width: 96px;
            height: auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 1rem 0 0.5rem;
        }

        p {
            margin: 0;
            color: #e2e8f0;
            line-height: 1.5;
        }

        button {
            margin-top: 1.25rem;
            min-height: 44px;
            padding: 0 1.25rem;
            border: 0;
            border-radius: 8px;
            background: #1a0a0a;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <img src="/static/images/logo.png" alt="AEGIS">
        <h1>Tidak ada koneksi</h1>
        <p>AEGIS butuh jaringan untuk prakiraan cuaca dan data tim. Muat ulang saat sinyal kembali.</p>
        <button type="button" onclick="location.reload()">Muat ulang</button>
    </main>
</body>

</html>
